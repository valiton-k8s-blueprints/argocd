---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: machine-deployment
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: bws-machine-deployment
                # anything not staging or prod use this version
                addonChartVersion: 0.1.5
                addonChartRepository: https://valiton-k8s-blueprints.github.io/charts
          - clusters:
              selector:
                matchLabels:
                  environment: staging
              values:
                addonChartVersion: 0.1.5
          - clusters:
              selector:
                matchLabels:
                  environment: production
              values:
                addonChartVersion: 0.1.5
  template:
    metadata:
      name: machine-deployment
      annotations:
        argocd.argoproj.io/compare-options: IncludeMutationWebhook=true
      finalizers:
        - resources-finalizer.argocd.argoproj.io/background
    spec:
      project: default
      sources:
        - repoURL: '{{.metadata.annotations.applications_repo_url}}'
          targetRevision: '{{.metadata.annotations.applications_repo_revision}}'
          ref: values
        - chart: '{{.values.addonChart}}'
          repoURL: '{{.values.addonChartRepository}}'
          targetRevision: '{{.values.addonChartVersion}}'
          helm:
            releaseName: machine-deployment
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{.metadata.annotations.applications_repo_path}}/config/machine-deployment/values.yaml
              - $values/{{.metadata.annotations.applications_repo_path}}/config/machine-deployment/{{.metadata.labels.environment}}.yaml
            values: |
              name: '{{.metadata.annotations.dynamic_worker_pool}}'
              machine:
                minSize: {{.metadata.annotations.dynamic_worker_min_size}}
                maxSize: {{.metadata.annotations.dynamic_worker_max_size}}
              openstack:
                flavor: {{.metadata.annotations.dynamic_worker_flavor_name}}
                image: {{.metadata.annotations.dynamic_worker_image_name}}
                network: {{.metadata.annotations.dynamic_worker_network_name}}
                rootDiskSizeGB: {{.metadata.annotations.dynamic_worker_disk_size}}
                securityGroups: 
                  - {{.metadata.annotations.dynamic_worker_network_name}}-allow-internal
                  - {{.metadata.annotations.cluster_name}}-external
                subnet: {{.metadata.annotations.dynamic_worker_subnet_name}}
      ignoreDifferences:
        - group: cluster.k8s.io
          kind: MachineDeployment
          jsonPointers:
            - /metadata/generation
            - /spec/replicas
      destination:
        namespace: kube-system
        name: '{{.name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
