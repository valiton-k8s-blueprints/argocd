apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: k8s-keystone-auth
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters: {}
  template:
    metadata:
      name: k8s-keystone-auth
    spec:
      project: default
      sources:
        - repoURL: '{{.metadata.annotations.applications_repo_url}}'
          targetRevision: '{{.metadata.annotations.applications_repo_revision}}'
          ref: values
        - repoURL: 'https://github.com/valiton-k8s-blueprints/charts.git'
          path: 'bws/k8s-keystone-auth'
          targetRevision: 'feature/keystone-auth'
          helm:
            releaseName: 'k8s-keystone-auth'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{.metadata.annotations.applications_repo_path}}/config/k8s-keystone-auth/values.yaml
              - $values/{{.metadata.annotations.applications_repo_path}}/config/k8s-keystone-auth/{{.metadata.labels.environment}}.yaml
            values: |
              authUrl: {{.metadata.annotations.openstack_auth_url}}
      destination:
        name: '{{.name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
